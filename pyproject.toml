[project]
name = "memem"
version = "0.2.0"
description = "Small MCP memory server shared across AI assistants, attached per chat."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
memem = "memem.cli:main"

[dependency-groups]
dev = ["workers-py", "uv>=0.13.4", "pytest", "httpx", "mcp", "anyio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memem"]
